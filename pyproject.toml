[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seqfile-toolkit"
version = "0.1.0"
description = "Dependency-free FASTA and FASTQ utilities for everyday sequence-file cleanup."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Morteza Aslanzadeh" }
]
keywords = ["bioinformatics", "fasta", "fastq", "sequencing", "ngs"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/iammrtza/SeqFile-Toolkit"
Issues = "https://github.com/iammrtza/SeqFile-Toolkit/issues"

[project.scripts]
seqfile-toolkit = "seqfile_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
